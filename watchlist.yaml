# FlipRadar – Watchlist
#
# query:      Suchbegriff auf den Plattformen
# include:    ALLE Begriffe müssen im Titel stehen. "a|b" = a ODER b.
# exclude:    keiner dieser Begriffe darf im Titel stehen (zusätzlich zu exclude_global)
# min_price_chf: darunter ignorieren (Zubehör, Fakes, Defekte)
# ref_price_chf: optional – eigener Marktwert, bis genug Vergleichsdaten da sind
# tutti_category: optional – Tutti-Kategorie (cars, cellPhones, consolesGames, computerComponentsAccessories)
# platforms:  optional – nur auf bestimmten Plattformen suchen
# enabled: false  -> Eintrag pausieren
#
# Wörter werden als ganze Wörter verglichen: "ti" trifft nicht "titan".

exclude_global:
  - defekt
  - kaputt
  - bastler
  - bastlerware
  - ersatzteil
  - ersatzteile
  - suche
  - gesucht
  - tausche
  - tausch
  - ankauf
  - kaufe
  - leerkarton
  - nur karton
  - nur ovp
  - ovp leer
  - attrappe
  - dummy
  - replika
  - icloud gesperrt
  - icloud lock
  - blacklist
  - miete
  - vermiete

# Zusätzliche Ausschlüsse pro Kategorie (z. B. Komplett-PCs bei Grafikkarten)
exclude_by_category:
  gpu: [ohne chip, ohne gpu, ohne grafikchip, no gpu, chip entfernt, pcb only, pc, gaming pc, komplett pc, komplettsystem, rechner, computer, system, laptop, notebook]
  cpu: [game pc, desktop, tower, gaming pc, komplett pc, komplettsystem, rechner, computer, laptop, notebook]
  ram: [game pc, desktop, tower, gaming pc, komplett pc, rechner, computer, laptop, notebook, sodimm, so dimm]
  ssd: [game pc, desktop, tower, gaming pc, komplett pc, rechner, computer, laptop, notebook]
  handy: [hülle, case, cover, panzerglas, schutzglas, displayschutz, schutzfolie]

